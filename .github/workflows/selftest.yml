name: Self test

# Manual only: proves the composite action wires inputs -> scan -> verdict in a
# real runner. Claims its own trial key at runtime (the runner has a fresh IP)
# and scans a one-package lockfile it writes itself, since this repo has none.
# fail-on: malicious, so a clear/error verdict passes; it will not go red when
# the trial credits run out.
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Claim a trial key
        run: |
          key="$(curl -s -X POST https://lazaretto.dev/v1/trial | jq -r '.api_key // empty')"
          if [ -z "$key" ]; then
            echo "::warning::no trial key (rate limited); the action will report only"
          else
            echo "::add-mask::$key"
          fi
          echo "LAZ_KEY=$key" >> "$GITHUB_ENV"
      - name: Write a one-package lockfile
        run: |
          cat > package-lock.json <<'JSON'
          {
            "name": "selftest",
            "lockfileVersion": 3,
            "packages": {
              "": { "name": "selftest", "dependencies": { "left-pad": "1.3.0" } },
              "node_modules/left-pad": { "version": "1.3.0" }
            }
          }
          JSON
      - uses: ./
        with:
          api-key: ${{ env.LAZ_KEY }}
          deep-scan: all
          fail-on: malicious
